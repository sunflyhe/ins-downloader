<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InstaDownloader - 本地视频下载器</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- CSS Styles -->
  <style>
    :root {
      --bg-dark: #0b0f19;
      --bg-card: rgba(17, 24, 39, 0.7);
      --border-color: rgba(255, 255, 255, 0.08);
      --primary: #c92bb9;
      --secondary: #fa5560;
      --gradient-brand: linear-gradient(135deg, #f91f97 0%, #ad13e6 50%, #4626f2 100%);
      --gradient-glow: linear-gradient(135deg, rgba(249,31,151,0.15) 0%, rgba(173,19,230,0.15) 50%, rgba(70,38,242,0.15) 100%);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-family);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      position: relative;
    }

    /* Ambient Background Glow */
    body::before {
      content: '';
      position: absolute;
      width: 400px;
      height: 400px;
      top: -100px;
      right: -100px;
      background: radial-gradient(circle, rgba(249,31,151,0.15) 0%, transparent 70%);
      z-index: -1;
      filter: blur(50px);
    }
    body::after {
      content: '';
      position: absolute;
      width: 500px;
      height: 500px;
      bottom: -150px;
      left: -150px;
      background: radial-gradient(circle, rgba(70,38,242,0.1) 0%, transparent 70%);
      z-index: -1;
      filter: blur(60px);
    }

    .connection-status {
      position: fixed;
      top: 1.25rem;
      right: 1.5rem;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.8rem;
      color: var(--text-muted);
      background: rgba(17, 24, 39, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 0.35rem 0.75rem;
      border-radius: 100px;
      border: 1px solid var(--border-color);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--danger);
      transition: background-color 0.3s;
    }

    .status-dot.connected {
      background-color: var(--success);
      box-shadow: 0 0 8px var(--success);
    }

    main {
      flex: 1;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      padding: 2rem;
      display: grid;
      grid-template-columns: 1fr 1.5fr;
      gap: 2rem;
    }

    @media (max-width: 968px) {
      main {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 1.5rem;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 0.75rem;
      color: #fff;
    }

    .card-title svg {
      color: var(--primary);
      width: 1.25rem;
      height: 1.25rem;
    }

    /* Form Styles */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    label {
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text-muted);
    }

    textarea {
      width: 100%;
      height: 120px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      color: var(--text-main);
      padding: 0.75rem;
      font-family: inherit;
      font-size: 0.9rem;
      resize: vertical;
      transition: all 0.3s;
    }

    textarea:focus {
      outline: none;
      border-color: rgba(249, 31, 151, 0.5);
      background: rgba(255, 255, 255, 0.05);
      box-shadow: 0 0 10px rgba(249, 31, 151, 0.15);
    }

    select {
      width: 100%;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      color: var(--text-main);
      padding: 0.75rem;
      font-family: inherit;
      font-size: 0.9rem;
      transition: all 0.3s;
      cursor: pointer;
    }

    select:focus {
      outline: none;
      border-color: rgba(249, 31, 151, 0.5);
      background: rgba(255, 255, 255, 0.05);
      box-shadow: 0 0 10px rgba(249, 31, 151, 0.15);
    }

    select option {
      background-color: var(--bg-dark);
      color: var(--text-main);
    }

    /* Drag and Drop Zone */
    .dropzone {
      border: 2px dashed rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 1.75rem 1rem;
      text-align: center;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.01);
      transition: all 0.3s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
    }

    .dropzone:hover, .dropzone.dragover {
      border-color: var(--primary);
      background: rgba(249, 31, 151, 0.03);
      box-shadow: inset 0 0 10px rgba(249, 31, 151, 0.05);
    }

    .dropzone svg {
      width: 2rem;
      height: 2rem;
      color: var(--text-muted);
      transition: color 0.3s;
    }

    .dropzone:hover svg {
      color: var(--primary);
    }

    .dropzone p {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .dropzone .highlight {
      color: #fff;
      font-weight: 500;
    }

    .btn {
      width: 100%;
      padding: 0.85rem;
      border: none;
      border-radius: 10px;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      color: #fff;
      cursor: pointer;
      background: var(--gradient-brand);
      box-shadow: 0 4px 15px rgba(173, 19, 230, 0.3);
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .btn:hover {
      opacity: 0.95;
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(173, 19, 230, 0.45);
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      box-shadow: none;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      box-shadow: none;
    }

    .actions-row {
      display: flex;
      gap: 0.75rem;
      width: 100%;
    }

    .actions-row .btn {
      flex: 1;
    }

    /* Queue Section */
    .queue-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
    }

    .queue-count {
      font-size: 0.85rem;
      background: rgba(255, 255, 255, 0.08);
      padding: 0.2rem 0.6rem;
      border-radius: 100px;
      color: var(--text-main);
    }

    .queue-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      max-height: calc(100vh - 11rem);
      min-height: 550px;
      overflow-y: auto;
      padding-right: 0.25rem;
    }

    .queue-list::-webkit-scrollbar {
      width: 5px;
    }
    .queue-list::-webkit-scrollbar-track {
      background: transparent;
    }
    .queue-list::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
    }

    .job-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      transition: all 0.3s;
    }

    .job-card:hover {
      border-color: rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.03);
    }

    .job-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
    }

    .job-url {
      font-size: 0.85rem;
      font-weight: 500;
      color: #fff;
      word-break: break-all;
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
    }

    .job-badge {
      font-size: 0.75rem;
      padding: 0.2rem 0.5rem;
      border-radius: 6px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .badge-pending {
      background: rgba(156, 163, 175, 0.15);
      color: var(--text-muted);
    }

    .badge-downloading {
      background: rgba(245, 158, 11, 0.15);
      color: var(--warning);
      animation: pulse 1.5s infinite;
    }

    .badge-completed {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
    }

    .badge-failed {
      background: rgba(239, 68, 68, 0.15);
      color: var(--danger);
    }

    @keyframes pulse {
      0% { opacity: 0.6; }
      50% { opacity: 1; }
      100% { opacity: 0.6; }
    }

    .job-info-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .job-progress-container {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 100px;
      overflow: hidden;
      position: relative;
    }

    .job-progress-bar {
      height: 100%;
      width: 0%;
      background: var(--gradient-brand);
      border-radius: 100px;
      transition: width 0.3s ease;
    }

    .job-file-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      background: rgba(255, 255, 255, 0.02);
      padding: 0.5rem;
      border-radius: 8px;
      border: 1px dashed rgba(255, 255, 255, 0.05);
    }

    .job-filename {
      font-size: 0.75rem;
      color: var(--text-muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }

    .job-open-btn, .job-action-btn {
      background: transparent;
      border: none;
      color: var(--primary);
      cursor: pointer;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 0.25rem;
      text-decoration: none;
    }

    .job-open-btn:hover, .job-action-btn:hover {
      background: rgba(249, 31, 151, 0.1);
      color: #fff;
    }

    .job-actions {
      display: flex;
      gap: 0.25rem;
    }

    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }

    .empty-state svg {
      width: 3rem;
      height: 3rem;
      opacity: 0.3;
    }

    /* Toast notification */
    .toast {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      background: rgba(17, 24, 39, 0.9);
      border: 1px solid var(--border-color);
      padding: 1rem 1.5rem;
      border-radius: 10px;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      backdrop-filter: blur(10px);
      transform: translateY(150%);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 100;
    }

    .toast.show {
      transform: translateY(0);
    }

    .toast-icon {
      color: var(--success);
    }

    .toast-msg {
      font-size: 0.9rem;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <div class="connection-status">
    <div id="statusDot" class="status-dot"></div>
    <span id="statusText">正在连接本地服务...</span>
  </div>

  <main>
    <div style="display: flex; flex-direction: column; gap: 1.5rem; height: 100%;">
      <div class="card" style="flex: 1; display: flex; flex-direction: column;">
        <div class="card-title">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"></path>
          </svg>
          导入下载任务
        </div>

        <!-- Text area import -->
        <div class="form-group" style="flex: 1; display: flex; flex-direction: column;">
          <label for="urlsInput">输入 Instagram 视频链接</label>
          <textarea id="urlsInput" style="flex: 1; min-height: 150px;" placeholder="https://www.instagram.com/p/xxxxx/&#10;https://www.instagram.com/reel/yyyyy/"></textarea>
        </div>

        <!-- Cookies Configuration -->
        <div class="form-group">
          <label for="cookiesBrowserSelect">浏览器 Cookie 来源</label>
          <select id="cookiesBrowserSelect">
            <option value="none">无 (默认)</option>
          </select>
        </div>

        <div style="text-align: center; color: var(--text-muted); font-size: 0.8rem; margin: -0.5rem 0;">或</div>

        <!-- Drag & Drop Zone -->
        <div class="form-group">
          <label>上传 CSV 或 Excel 文件批量导入</label>
          <div id="dropzone" class="dropzone">
            <svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 16.5V9.75m0 0l3 3m-3-3l-3 3M6.75 19.5a4.5 4.5 0 01-1.41-8.775 5.25 5.25 0 0110.233-2.33 3 3 0 013.758 3.848A3.752 3.752 0 0118 19.5H6.75z"></path>
            </svg>
            <p><span class="highlight">点击选择</span> 或拖拽文件至此</p>
            <p style="font-size: 0.75rem;">支持 .csv, .xlsx, .xls</p>
            <input type="file" id="fileInput" accept=".csv,.xlsx,.xls" style="display: none;">
          </div>
        </div>

        <button id="addBtn" class="btn">
          <svg style="width: 1.25rem; height: 1.25rem;" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
          </svg>
          开始下载任务
        </button>
        <button id="clearUrlsBtn" class="btn btn-secondary">清除链接</button>
      </div>

    </div>

    <!-- Right Content: Queue Status -->
    <div class="card">
      <div class="queue-header">
        <div class="card-title" style="border-bottom: none; padding-bottom: 0; margin-bottom: 0;">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 6.75h12M8.25 12h12m-12 5.25h12M3.75 6.75h.007v.008H3.75V6.75zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zM3.75 12h.007v.008H3.75V12zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zm-.375 5.25h.007v.008H3.75v-.008zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z"></path>
          </svg>
          下载任务队列
        </div>
        <span id="queueCount" class="queue-count">0 个任务</span>
      </div>

      <div class="actions-row">
        <button id="openFolderBtn" class="btn btn-secondary">
          <svg style="width: 1.1rem; height: 1.1rem; color: var(--text-muted);" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 9.776c.112-.017.227-.026.344-.026h15.812c.117 0 .232.009.344.026m-16.5 0a2.25 2.25 0 00-1.883 2.542l.857 6a2.25 2.25 0 002.227 1.932H19.05a2.25 2.25 0 002.227-1.932l.857-6a2.25 2.25 0 00-1.883-2.542m-16.5 0V6A2.25 2.25 0 016 3.75h3.879a1.5 1.5 0 011.06.44l2.122 2.12a1.5 1.5 0 001.06.44H18A2.25 2.25 0 0120.25 9v.776"></path>
          </svg>
          打开下载文件夹
        </button>
        <button id="clearBtn" class="btn btn-secondary">
          <svg style="width: 1.1rem; height: 1.1rem; color: var(--text-muted);" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
          </svg>
          清空已完成
        </button>
      </div>

      <div id="queueList" class="queue-list">
        <!-- Empty State -->
        <div class="empty-state">
          <svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" d="M20.25 7.5l-.625 10.632a2.25 2.25 0 01-2.247 2.118H6.622a2.25 2.25 0 01-2.247-2.118L3.75 7.5m8.25 3v6.75m0 0l-3-3m3 3l3-3M3.375 7.5h17.25c.621 0 1.125-.504 1.125-1.125v-1.5c0-.621-.504-1.125-1.125-1.125H3.375c-.621 0-1.125.504-1.125 1.125v1.5c0 .621.504 1.125 1.125 1.125z"></path>
          </svg>
          <p>当前队列为空，请在左侧添加下载任务</p>
        </div>
      </div>
    </div>
  </main>

  <!-- Toast Notification -->
  <div id="toast" class="toast">
    <svg class="toast-icon" style="width: 1.25rem; height: 1.25rem;" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
    </svg>
    <span id="toastMsg" class="toast-msg">任务添加成功！</span>
  </div>

  <!-- SheetJS & PapaParse for CSV / Excel parsing in frontend -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <script>
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const queueList = document.getElementById('queueList');
    const queueCount = document.getElementById('queueCount');
    const urlsInput = document.getElementById('urlsInput');
    const addBtn = document.getElementById('addBtn');
    const clearUrlsBtn = document.getElementById('clearUrlsBtn');
    const clearBtn = document.getElementById('clearBtn');
    const openFolderBtn = document.getElementById('openFolderBtn');
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('fileInput');
    const toast = document.getElementById('toast');
    const toastMsg = document.getElementById('toastMsg');
    const cookiesBrowserSelect = document.getElementById('cookiesBrowserSelect');

    let jobsMap = new Map();

    // Render browser options from installed apps, then restore localStorage selection
    async function loadInstalledBrowsers() {
      try {
        const res = await fetch('/api/browsers');
        const data = await res.json();
        const browsers = Array.isArray(data.browsers) ? data.browsers : [];

        cookiesBrowserSelect.innerHTML = '<option value="none">无 (默认)</option>';
        browsers.forEach(browser => {
          const option = document.createElement('option');
          option.value = browser.id;
          option.textContent = browser.label;
          cookiesBrowserSelect.appendChild(option);
        });

        const saved = localStorage.getItem('cookiesBrowser');
        if (saved && [...cookiesBrowserSelect.options].some(o => o.value === saved)) {
          cookiesBrowserSelect.value = saved;
        } else {
          cookiesBrowserSelect.value = 'none';
          localStorage.setItem('cookiesBrowser', 'none');
        }
      } catch (err) {
        console.error('Failed to load installed browsers:', err);
      }
    }

    cookiesBrowserSelect.addEventListener('change', () => {
      localStorage.setItem('cookiesBrowser', cookiesBrowserSelect.value);
    });
    loadInstalledBrowsers();

    // Show toast message
    function showToast(message, isError = false) {
      toastMsg.innerText = message;
      const icon = toast.querySelector('.toast-icon');
      if (isError) {
        icon.style.color = 'var(--danger)';
        icon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"></path>`;
      } else {
        icon.style.color = 'var(--success)';
        icon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>`;
      }
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3000);
    }

    // Connect to Server-Sent Events (SSE)
    function connectSSE() {
      const eventSource = new EventSource('/api/events');

      eventSource.onopen = () => {
        statusDot.classList.add('connected');
        statusText.innerText = '本地服务已连接';
      };

      eventSource.onerror = () => {
        statusDot.classList.remove('connected');
        statusText.innerText = '连接断开，正在重试...';
      };

      eventSource.addEventListener('init', (e) => {
        const initialJobs = JSON.parse(e.data);
        jobsMap.clear();
        initialJobs.forEach(job => jobsMap.set(job.id, job));
        renderQueue();
      });

      eventSource.addEventListener('jobs-added', (e) => {
        const newJobs = JSON.parse(e.data);
        newJobs.forEach(job => jobsMap.set(job.id, job));
        renderQueue();
      });

      eventSource.addEventListener('job-updated', (e) => {
        const updatedJob = JSON.parse(e.data);
        jobsMap.set(updatedJob.id, updatedJob);
        updateJobDOM(updatedJob);
      });

      eventSource.addEventListener('jobs-cleared', (e) => {
        const remainingJobs = JSON.parse(e.data);
        jobsMap.clear();
        remainingJobs.forEach(job => jobsMap.set(job.id, job));
        renderQueue();
      });
    }

    // Render entire queue list
    function renderQueue() {
      if (jobsMap.size === 0) {
        queueList.innerHTML = `
          <div class="empty-state">
            <svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path stroke-linecap="round" stroke-linejoin="round" d="M20.25 7.5l-.625 10.632a2.25 2.25 0 01-2.247 2.118H6.622a2.25 2.25 0 01-2.247-2.118L3.75 7.5m8.25 3v6.75m0 0l-3-3m3 3l3-3M3.375 7.5h17.25c.621 0 1.125-.504 1.125-1.125v-1.5c0-.621-.504-1.125-1.125-1.125H3.375c-.621 0-1.125.504-1.125 1.125v1.5c0 .621.504 1.125 1.125 1.125z"></path>
            </svg>
            <p>当前队列为空，请在左侧添加下载任务</p>
          </div>
        `;
        queueCount.innerText = '0 个任务';
        return;
      }

      queueCount.innerText = `${jobsMap.size} 个任务`;
      queueList.innerHTML = '';
      
      // Sort jobs by ID or order added (reverse for recent on top)
      const sortedJobs = Array.from(jobsMap.values()).reverse();
      
      sortedJobs.forEach(job => {
        queueList.appendChild(createJobElement(job));
      });
    }

    // Create a single job element
    function createJobElement(job) {
      const card = document.createElement('div');
      card.className = 'job-card';
      card.id = `job-${job.id}`;
      
      let badgeClass = 'badge-pending';
      let statusText = '排队中';
      if (job.status === 'downloading') {
        badgeClass = 'badge-downloading';
        statusText = '下载中';
      } else if (job.status === 'completed') {
        badgeClass = 'badge-completed';
        statusText = '已完成';
      } else if (job.status === 'failed') {
        badgeClass = 'badge-failed';
        statusText = '失败';
      }

      const showProgress = job.status === 'downloading' || job.status === 'completed';
      const progressPercent = job.progress || 0;
      
      // Speed and ETA description
      let speedEta = '';
      if (job.status === 'downloading' && job.speed) {
        speedEta = `速度: ${job.speed} | 剩余: ${job.eta}`;
      } else if (job.status === 'completed') {
        speedEta = '下载完毕';
      } else if (job.status === 'failed') {
        speedEta = job.error || '出错了';
      } else {
        speedEta = '等待中...';
      }

      card.innerHTML = `
        <div class="job-top">
          <div class="job-url" title="${job.url}">${job.url}</div>
          <span class="job-badge ${badgeClass}">${statusText}</span>
        </div>
        <div class="job-info-row">
          <span>${job.addedAt}</span>
          <span class="job-speed-eta">${speedEta}</span>
        </div>
        <div class="job-progress-container" style="display: ${showProgress ? 'block' : 'none'}">
          <div class="job-progress-bar" style="width: ${progressPercent}%"></div>
        </div>
        <div class="job-file-info" style="display: ${job.status === 'completed' && job.filename ? 'flex' : 'none'}">
          <div class="job-filename" title="${job.filename}">📁 ${job.filename}</div>
          <div class="job-actions">
            ${job.downloadUrl ? `<a class="job-action-btn" href="${job.downloadUrl}" download="${job.filename}">下载视频</a>` : ''}
            <button class="job-open-btn" onclick="openFile('${job.filePath.replace(/\\/g, '\\\\')}')">
              打开本地
            </button>
          </div>
        </div>
      `;
      return card;
    }

    // Update specific job in the DOM to prevent full rerender
    function updateJobDOM(job) {
      const card = document.getElementById(`job-${job.id}`);
      if (!card) {
        renderQueue(); // Fallback to full render if card not found
        return;
      }

      // Update badge
      const badge = card.querySelector('.job-badge');
      badge.className = 'job-badge';
      let statusText = '排队中';
      if (job.status === 'downloading') {
        badge.classList.add('badge-downloading');
        statusText = '下载中';
      } else if (job.status === 'completed') {
        badge.classList.add('badge-completed');
        statusText = '已完成';
      } else if (job.status === 'failed') {
        badge.classList.add('badge-failed');
        statusText = '失败';
      }
      badge.innerText = statusText;

      // Update progress bar
      const progContainer = card.querySelector('.job-progress-container');
      const progBar = card.querySelector('.job-progress-bar');
      const showProgress = job.status === 'downloading' || job.status === 'completed';
      progContainer.style.display = showProgress ? 'block' : 'none';
      progBar.style.width = `${job.progress || 0}%`;

      // Update speed & ETA info
      const speedEtaEl = card.querySelector('.job-speed-eta');
      let speedEta = '';
      if (job.status === 'downloading' && job.speed) {
        speedEta = `速度: ${job.speed} | 剩余: ${job.eta}`;
      } else if (job.status === 'completed') {
        speedEta = '下载完毕';
      } else if (job.status === 'failed') {
        speedEta = job.error || '出错了';
      } else {
        speedEta = '等待中...';
      }
      speedEtaEl.innerText = speedEta;

      // Update file info block
      const fileInfo = card.querySelector('.job-file-info');
      if (job.status === 'completed' && job.filename) {
        fileInfo.style.display = 'flex';
        fileInfo.innerHTML = `
          <div class="job-filename" title="${job.filename}">📁 ${job.filename}</div>
          <div class="job-actions">
            ${job.downloadUrl ? `<a class="job-action-btn" href="${job.downloadUrl}" download="${job.filename}">下载视频</a>` : ''}
            <button class="job-open-btn" onclick="openFile('${job.filePath.replace(/\\/g, '\\\\')}')">
              打开本地
            </button>
          </div>
        `;
      } else {
        fileInfo.style.display = 'none';
      }
      
      // Update local storage representation
      jobsMap.set(job.id, job);
      
      // Update count badge
      queueCount.innerText = `${jobsMap.size} 个任务`;
    }

    // Call open-file endpoint
    function openFile(filePath) {
      fetch('/api/open-file', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ filePath })
      })
      .then(res => res.json())
      .then(data => {
        if (data.error) showToast(data.error, true);
      })
      .catch(err => showToast('无法打开文件', true));
    }

    // Add URLs from manual textarea
    function triggerDownload(urls) {
      if (urls.length === 0) return;
      
      const cookiesBrowser = cookiesBrowserSelect.value;
      
      fetch('/api/download', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ urls, cookiesBrowser })
      })
      .then(res => res.json())
        .then(data => {
          if (data.success) {
            showToast(`已成功添加 ${data.count} 个任务`);
          } else {
          showToast(data.error || '添加任务失败', true);
        }
      })
      .catch(() => showToast('服务器连接失败', true));
    }

    addBtn.addEventListener('click', () => {
      const content = urlsInput.value;
      const urls = content.split('\n')
        .map(url => url.trim())
        .filter(url => url.startsWith('http://') || url.startsWith('https://'));
      
      if (urls.length === 0) {
        showToast('请输入有效的 Instagram 视频 URL (以 http/https 开头)', true);
        return;
      }
      triggerDownload(urls);
    });

    clearUrlsBtn.addEventListener('click', () => {
      urlsInput.value = '';
      urlsInput.focus();
    });

    // Clear completed tasks
    clearBtn.addEventListener('click', () => {
      fetch('/api/clear', { method: 'POST' })
        .then(res => res.json())
        .then(data => {
          if (data.success) {
            showToast('已清理已完成任务');
          }
        });
    });

    // Open download folder in finder
    openFolderBtn.addEventListener('click', () => {
      fetch('/api/open-folder', { method: 'POST' })
        .then(res => res.json())
        .then(data => {
          if (data.error) showToast(data.error, true);
        });
    });

    // --- Drag and Drop File Parsing Logic ---

    // Prevent default drag behaviors
    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
      dropzone.addEventListener(eventName, preventDefaults, false);
      document.body.addEventListener(eventName, preventDefaults, false);
    });

    function preventDefaults(e) {
      e.preventDefault();
      e.stopPropagation();
    }

    // Toggle highlight class when dragging over
    ['dragenter', 'dragover'].forEach(eventName => {
      dropzone.addEventListener(eventName, () => dropzone.classList.add('dragover'), false);
    });

    ['dragleave', 'drop'].forEach(eventName => {
      dropzone.addEventListener(eventName, () => dropzone.classList.remove('dragover'), false);
    });

    // Handle dropped files
    dropzone.addEventListener('drop', (e) => {
      const dt = e.dataTransfer;
      const files = dt.files;
      if (files.length > 0) {
        handleFile(files[0]);
      }
    });

    // Handle click to select file
    dropzone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) {
        handleFile(e.target.files[0]);
      }
    });

    // Parse CSV or Excel file
    function handleFile(file) {
      const reader = new FileReader();
      const extension = file.name.split('.').pop().toLowerCase();

      if (extension === 'csv') {
        reader.onload = function (e) {
          const text = e.target.result;
          parseCSV(text);
        };
        reader.readAsText(file);
      } else if (extension === 'xlsx' || extension === 'xls') {
        reader.onload = function (e) {
          const data = new Uint8Array(e.target.result);
          parseExcel(data);
        };
        reader.readAsArrayBuffer(file);
      } else {
        showToast('仅支持 .csv, .xlsx, .xls 文件格式', true);
      }
    }

    // Parse CSV helper using PapaParse
    function parseCSV(text) {
      Papa.parse(text, {
        complete: function(results) {
          extractUrlsFromGrid(results.data);
        },
        error: function(err) {
          showToast('CSV 文件解析错误: ' + err.message, true);
        }
      });
    }

    // Parse Excel helper using SheetJS (XLSX)
    function parseExcel(data) {
      try {
        const workbook = XLSX.read(data, { type: 'array' });
        const sheetName = workbook.SheetNames[0];
        const sheet = workbook.Sheets[sheetName];
        // Convert to array of arrays
        const rows = XLSX.utils.sheet_to_json(sheet, { header: 1 });
        extractUrlsFromGrid(rows);
      } catch (err) {
        showToast('Excel 文件解析错误: ' + err.message, true);
      }
    }

    // Find and extract any valid Instagram URL from any cell in the file grid
    function extractUrlsFromGrid(grid) {
      const urls = [];
      const insUrlRegex = /(https?:\/\/(?:www\.)?instagram\.com\/(?:p|reel|reels|tv)\/[A-Za-z0-9_-]+)/i;

      for (let r = 0; r < grid.length; r++) {
        const row = grid[r];
        if (!row || !Array.isArray(row)) continue;
        
        for (let c = 0; c < row.length; c++) {
          const cellVal = String(row[c] || '').trim();
          if (!cellVal) continue;

          // Check if the cell content contains an Instagram link
          const match = cellVal.match(insUrlRegex);
          if (match) {
            urls.push(match[1]); // push the matched URL group
          }
        }
      }

      if (urls.length === 0) {
        showToast('未在文件中找到有效的 Instagram (p/reel/reels/tv) 视频链接', true);
        return;
      }

      // Populate text area with found URLs for preview and user's flexibility
       const currentVal = urlsInput.value.trim();
       const combinedVal = currentVal ? (currentVal + '\n' + urls.join('\n')) : urls.join('\n');
       urlsInput.value = combinedVal;
       showToast(`已从文件中读取并合并 ${urls.length} 个 Instagram 链接！请点击开始下载。`);
    }

    // Start everything
    connectSSE();
  </script>
</body>
